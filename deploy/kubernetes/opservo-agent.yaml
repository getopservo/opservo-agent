# Opservo Kubernetes agent.
#
# One read-only cluster collector per cluster. Apply with the URL the dashboard
# gives you (Add server → Kubernetes cluster); the API fills in the enrollment
# token, API URL and cluster name (base64, as Secret data). To apply by hand,
# replace the three __…_B64__ placeholders with base64 values.
#
# What it can do: get/list/watch cluster objects, read pod logs, read
# metrics.k8s.io, read the API server's own /metrics. What it cannot do: create,
# change or delete anything in your cluster — the ONLY write it holds is on one
# Secret in its own namespace, where it stores the agent id + key it receives
# at registration so a pod restart does not re-register the cluster.
# No hostPath, no privileged, non-root, read-only root filesystem.
apiVersion: v1
kind: Namespace
metadata:
  name: opservo
  labels:
    app.kubernetes.io/name: opservo-k8s-agent
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opservo-k8s-agent
  namespace: opservo
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opservo-k8s-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces", "events", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # The API server's own Prometheus endpoint (request/etcd latency).
  - nonResourceURLs: ["/metrics", "/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opservo-k8s-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opservo-k8s-agent
subjects:
  - kind: ServiceAccount
    name: opservo-k8s-agent
    namespace: opservo
---
# The one write the agent holds: its own credentials Secret, in its own
# namespace, by name. (create cannot be name-scoped in RBAC, so it is granted
# on the resource; get/update are pinned to the one name.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opservo-k8s-agent-credentials
  namespace: opservo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["opservo-agent-credentials"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opservo-k8s-agent-credentials
  namespace: opservo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opservo-k8s-agent-credentials
subjects:
  - kind: ServiceAccount
    name: opservo-k8s-agent
    namespace: opservo
---
# Filled in by the API when served from /install-k8s.yaml?token=…
apiVersion: v1
kind: Secret
metadata:
  name: opservo-k8s-agent-enroll
  namespace: opservo
type: Opaque
data:
  OPSERVO_API_URL: __OPSERVO_API_URL_B64__
  OPSERVO_TOKEN: __OPSERVO_TOKEN_B64__
  OPSERVO_CLUSTER_NAME: __OPSERVO_CLUSTER_NAME_B64__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opservo-k8s-agent
  namespace: opservo
  labels:
    app.kubernetes.io/name: opservo-k8s-agent
spec:
  # Exactly one collector per cluster — a second replica would double-report.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opservo-k8s-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opservo-k8s-agent
    spec:
      serviceAccountName: opservo-k8s-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # The API fills this in when it serves the manifest: OPSERVO_K8S_AGENT_IMAGE
          # on the API (pin by digest: ghcr.io/getopservo/opservo-k8s-agent@sha256:…),
          # else the floating :latest. IfNotPresent: a pod restart never silently
          # picks up a different build (16 Oct 2026 review).
          image: __OPSERVO_K8S_IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["--interval=60s"]
          envFrom:
            - secretRef:
                name: opservo-k8s-agent-enroll
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
