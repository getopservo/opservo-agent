name: Kubernetes agent image

# Publishes ghcr.io/getopservo/opservo-k8s-agent. `main` publishes :latest
# (+ :sha-…), tags v* publish :vX, and k8s-agent-vX.Y.Z tags publish :X.Y.Z
# (the version the Helm chart's appVersion pins). The package must be PUBLIC
# (Packages → opservo-k8s-agent → Package settings → Change visibility) so clusters can
# pull it without a pull secret.
on:
  push:
    branches: [main]
    tags: ['v*', 'k8s-agent-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signature (Sigstore)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/getopservo/opservo-k8s-agent
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=match,pattern=k8s-agent-v(\d+\.\d+\.\d+.*),group=1
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.k8s-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/k8s-agent-v') && steps.meta.outputs.version || github.sha }}
      # Sign the published image (keyless, Sigstore/Rekor) so a cluster can verify
      # that what ghcr serves was built by THIS workflow:
      #   cosign verify ghcr.io/getopservo/opservo-k8s-agent@<digest> \
      #     --certificate-identity-regexp 'https://github.com/getopservo/opservo-agent/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/getopservo/opservo-k8s-agent@${DIGEST}"
